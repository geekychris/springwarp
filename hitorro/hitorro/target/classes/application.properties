# Database Configuration
#spring.datasource.url=jdbc:h2:mem:hitorrodb
#spring.datasource.url=jdbc:h2:file:/Users/chris/code/db_warp_app/data
spring.datasource.url=jdbc:h2:file:/Users/chris//h2data
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=hitorro-group
spring.kafka.consumer.auto-offset-reset=earliest

